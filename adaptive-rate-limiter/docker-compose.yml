services:
  redis:
    image: redis:7.2-alpine
    container_name: adaptive-rate-limiter-redis
    restart: unless-stopped
    ports:
      # Bound strictly to 127.0.0.1 so Redis is never exposed over the Wi-Fi LAN
      - "127.0.0.1:6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  redis_data:
